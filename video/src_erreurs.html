<script>
/* =====================================================================

  11.12  S3  « 2 » rouge 3D → ERREUR : attendre des semaines (calendrier)  — impact, ticks
  14.72      FIX vert : « 6–7 JOURS », barre de chargement 100 %          — whoosh, ding
  16.40      Iris qui se ferme, point rouge qui bat (silence dramatique)  — heartbeat
  17.56  S4  « 1 » rouge géant, alarme → payer des centaines d'€          — riser, impact, glitch
  21.36      Flood vert : « LE MIEN » 14€ 3D                             — impact
  23.24  S5  4 cartes qui se retournent : running / luxe / streetwear / sneakers — flips
  26.92  S6  « NE FAIS PLUS CES ERREURS » : erreurs cochées → fin LIEN EN BIO — ticks, impact
   ===================================================================== */
const DUR = 30.5;
const WORDS = WORDS_JSON("erreurs");
const GROUPS = makeGroups(WORDS);
const BG = [[0, C.ink], [6.74, C.lime], [11.1, C.ink], [14.94, C.lime], [16.9, C.ink], [21.44, C.lime], [23.24, C.cream], [26.92, C.ink], [28.62, C.lime]];
const HITS = [[0.32, 14], [3.6, 22], [5.0, 10], [6.75, 12], [10.24, 18], [11.12, 22], [14.95, 12], [15.52, 16], [18.48, 30], [20.4, 16], [21.45, 22], [22.36, 22], [26.92, 14], [28.62, 16], [28.9, 16]];
const SCENES = [[0, 'ALERTE'], [3.52, 'ERREUR N°3'], [6.56, 'LA SOLUTION'], [11.12, 'ERREUR N°2'], [14.72, 'LA SOLUTION'], [17.56, 'ERREUR N°1'], [21.36, 'LA SOLUTION'], [23.24, 'CATALOGUE'], [26.92, 'FOURNISSEUR 14 €']];

// fenêtre d'erreur style système
function DLG(parent, title, msg, w, msgSize = 54, ok = false) {
  const e = E(parent, `width:${w}px;border-radius:22px;overflow:hidden;background:${C.cream};box-shadow:0 30px 60px rgba(0,0,0,.5)`, '', 'L');
  const bar = E(e, `position:relative;height:58px;background:#1B1B24;display:flex;align-items:center;gap:10px;padding:0 20px`, `<span style="width:16px;height:16px;border-radius:50%;background:${C.red}"></span><span style="width:16px;height:16px;border-radius:50%;background:#FFB020"></span><span style="width:16px;height:16px;border-radius:50%;background:#3BD16F"></span><span class="tt" style="font:500 22px JM;letter-spacing:.16em;color:${C.cream};margin-left:14px">${title}</span>`);
  const body = E(e, `position:relative;display:flex;align-items:center;gap:26px;padding:30px 34px 34px`,
    `<div class="ic" style="flex:none;width:96px;height:96px;border-radius:50%;background:${C.red};display:flex;align-items:center;justify-content:center">${svg('0 0 40 40', `<path d="M12 12 L28 28 M28 12 L12 28" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`, 48, 48)}</div><div class="ms" style="font:${msgSize}px AB;color:${C.ink};line-height:1.02;letter-spacing:-.02em">${msg}</div>`);
  e.ic = body.querySelector('.ic'); e.ms = body.querySelector('.ms'); e.tt = bar.querySelector('.tt');
  e.setOk = k => { e.ic.style.background = k ? '#18A957' : C.red; e.ic.innerHTML = k ? svg('0 0 40 40', `<path d="M11 21 L18 28 L30 13" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`, 48, 48) : svg('0 0 40 40', `<path d="M12 12 L28 28 M28 12 L12 28" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`, 48, 48); };
  return e;
}
// texte glitch (séparation RGB)
function GL(parent, text, css) {
  const g = E(parent, '', '', 'L');
  const r = Tx(g, text, css + `;color:${C.red};mix-blend-mode:screen`), b = Tx(g, text, css + `;color:#2FD8FF;mix-blend-mode:screen`), m = Tx(g, text, css + `;color:${C.cream}`);
  [r, b, m].forEach(x => x.style.transform = 'translate(-50%,-50%)');
  g.jit = (t, amt) => { const q = Math.floor(t * 24), h = rng(q)(), h2 = rng(q + 99)(); const a = amt * (h > .6 ? 1 : .25); r.style.transform = `translate(-50%,-50%) translate(${-a * 14}px,${(h2 - .5) * a * 8}px)`; b.style.transform = `translate(-50%,-50%) translate(${a * 14}px,${(h - .5) * a * 8}px)`; m.style.transform = `translate(-50%,-50%) translateX(${(h2 > .85 ? (h - .5) * 40 : 0) * amt}px)`; m.style.clipPath = h2 > .9 && amt > .3 ? `inset(${h * 60}% 0 ${(1 - h) * 20}% 0)` : ''; };
  return g;
}
const BADGE = (parent, n) => E(parent, `width:130px;height:130px;border-radius:50%;background:${C.red};display:flex;align-items:center;justify-content:center;font:84px AB;color:#fff;letter-spacing:-.04em`, n, 'L');

async function init() {
  await loadFonts();
  const stage = document.getElementById('stage');
  const R = rng(23);
  const bg = E(stage, '', '', 'full');
  const world = E(stage, '', '', 'full');
  const alarm = E(world, `background:radial-gradient(ellipse 70% 55% at 50% 50%, rgba(255,59,48,0) 40%, rgba(255,59,48,.45) 100%)`, '', 'full');

  // ================= S1 : alerte =================
  const A = E(world, 'perspective:1600px', '', 'full');
  const MSGS = ['Marge : 0 €', 'Article invendu', 'Colis en retard', 'Fournisseur : €€€', 'Photos : aucune', 'Stock bloqué', 'Prix trop élevé', 'Délai : 4 semaines', 'Vente annulée', 'Marge : 0 €', 'Article invendu', 'Colis en retard', 'Paiement : €€€', 'Erreur inconnue'];
  const dl = MSGS.map((m, i) => ({ e: DLG(A, 'ERREUR', m, 460 + R() * 120, 40), x: 160 + R() * 760, y: 330 + R() * 1000, r: (R() - .5) * 16, t0: .02 + i * .085, a: R() * Math.PI * 2 }));
  const plate = E(A, `width:1000px;height:300px;background:${C.ink};border-radius:30px;box-shadow:0 0 0 6px ${C.red}`, '', 'L');
  const aTitle = GL(A, '3 ERREURS', `font:150px AB;letter-spacing:-.04em`);
  const aSub1 = MW(A, "qui t'empêchent de", `font:italic 96px IS;color:${C.cream}`);
  const aSub2 = MW(A, "gagner de l'argent", `font:italic 96px IS;color:${C.lime}`);
  const aSub3 = Tx(A, 'AVEC LA REVENTE', `font:500 32px JM;letter-spacing:.3em;color:${C.cream}`);

  // ================= blocs ERREUR (3, 2, 1) =================
  function errorBlock(n, msg, msgSize) {
    const S = E(world, 'perspective:1600px', '', 'full');
    const num = EXT(S, n, 640, 24, 130, C.red, '#7a1510', '#2a0604', '#9a1a12');
    const lab = Tx(S, `ERREUR N°${n}`, `font:500 40px JM;letter-spacing:.35em;color:${C.red}`);
    const badge = BADGE(S, n);
    const dlg = DLG(S, `ERREUR N°${n}`, msg, 900, msgSize);
    return { S, num, lab, badge, dlg };
  }
  const e3 = errorBlock('3', 'ACHETER SANS<br>VOIR L\'ARTICLE', 66);
  const myst = BOX(e3.S, 260, ['#C8955A', '#B07E46', '#C8955A', '#A57540', '#D9A86C', '#8E6234'], '?');
  const qm = Tx(e3.S, '?', `font:200px AB;color:${C.red}`);
  const e2 = errorBlock('2', 'ATTENDRE DES<br>SEMAINES', 66);
  const cal = E(e2.S, `width:400px;height:430px;border-radius:30px;background:${C.cream};overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.4)`, `<div style="height:110px;background:${C.red};display:flex;align-items:center;justify-content:center;font:46px AB;color:#fff;letter-spacing:.04em">SEMAINE</div>`, 'L p3');
  const calN = Tx(cal, '1', `font:250px AB;color:${C.ink};left:200px;top:270px;transform:translate(-50%,-50%);letter-spacing:-.05em`);
  const load = E(e2.S, `width:820px;height:110px;border-radius:24px;background:#1B1B24;padding:22px 26px`, `<div style="display:flex;justify-content:space-between;font:500 24px JM;letter-spacing:.14em;color:${C.cream}"><span class="lt2">EN ATTENTE…</span><span class="pc">23 %</span></div><div style="margin-top:14px;height:16px;border-radius:8px;background:#33333f;overflow:hidden"><div class="fill" style="height:100%;width:23%;background:${C.red}"></div></div>`, 'L');
  const loadFill = load.querySelector('.fill'), loadPc = load.querySelector('.pc'), loadLt = load.querySelector('.lt2');
  const e1 = errorBlock('1', 'PAYER SON FOURNISSEUR<br>DES CENTAINES D\'€', 52);
  const e1Kick = Tx(e1.S, "ET L'ERREUR", `font:500 40px JM;letter-spacing:.35em;color:${C.cream}`);
  const e1Price = GL(e1.S, '300+ €', `font:220px AB;letter-spacing:-.05em`);

  // ================= FIX (vert) =================
  const wipe1 = E(world, `width:2400px;height:1920px;background:${C.lime};clip-path:polygon(12% 0,100% 0,100% 100%,0 100%)`, '', 'L');
  const F1 = E(world, 'perspective:1500px', '', 'full');
  const f1k = Tx(F1, '✓ LA SOLUTION', `font:500 34px JM;letter-spacing:.3em;color:${C.ink}`);
  const f1t = MW(F1, "PHOTOS AVANT L'ENVOI", `font:76px AB;color:${C.ink};letter-spacing:-.02em`);
  const pols = [['hood', '#E2E8FF', -12, 260, 820], ['run', '#FFFFFF', 2, 540, 760], ['sneak', '#FFE7D6', 13, 820, 830]].map(([ic, bc, r, x, y], i) => ({ e: E(F1, `width:300px;height:372px;background:#fff;padding:18px;border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.25)`,
    `<div style="position:relative;width:264px;height:270px;background:${bc};display:flex;align-items:center;justify-content:center">${icon(ic, '#1D1D25', '#fff', 200)}<div style="position:absolute;left:10px;top:10px;width:30px;height:30px;border-left:4px solid #1D1D25;border-top:4px solid #1D1D25"></div><div style="position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-right:4px solid #1D1D25;border-bottom:4px solid #1D1D25"></div></div><div style="display:flex;justify-content:space-between;margin-top:20px;font:500 22px JM;color:#333;letter-spacing:.1em"><span>PHOTO QC</span><span>${i + 1}/3</span></div>`, 'L'), r, x, y }));
  const f1pas = E(F1, `display:flex;align-items:center;gap:18px;background:${C.ink};border-radius:50px;padding:18px 34px 18px 18px;width:max-content`, `<div style="width:64px;height:64px;border-radius:50%;background:${C.red};display:flex;align-items:center;justify-content:center">${svg('0 0 40 40', `<path d="M12 12 L28 28 M28 12 L12 28" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`, 34, 34)}</div><span style="font:52px AB;color:${C.cream}">PAS BON ?</span>`, 'L');
  const f1rem = Tx(F1, 'REMBOURSÉ', `font:120px AB;color:${C.ink};border:12px solid ${C.ink};border-radius:24px;padding:12px 34px 4px;letter-spacing:-.03em`);
  const flashR = E(stage, `background:${C.red}`, '', 'full');

  const wipe2 = E(world, `width:2400px;height:1920px;background:${C.lime};clip-path:polygon(12% 0,100% 0,100% 100%,0 100%)`, '', 'L');
  const F2 = E(world, 'perspective:1500px', '', 'full');
  const speed = Array.from({ length: 26 }, () => ({ e: E(F2, `height:${3 + R() * 5}px;width:${160 + R() * 380}px;background:rgba(11,11,16,${.1 + R() * .2});border-radius:4px`, '', 'L'), y: 250 + R() * 1150, sp: 2600 + R() * 2400, o: R() * 2000 }));
  const f2ici = MW(F2, 'ICI', `font:130px AB;color:${C.ink};letter-spacing:-.03em`);
  const f2n6 = MW(F2, '6', `font:330px AB;color:${C.ink};letter-spacing:-.05em`);
  const f2n7 = MW(F2, '–7', `font:330px AB;color:${C.ink};letter-spacing:-.05em`);
  const f2j = MW(F2, 'JOURS', `font:140px AB;color:${C.ink};letter-spacing:-.02em`);
  const f2box = BOX(F2, 180);
  const f2load = E(F2, `width:820px;height:110px;border-radius:24px;background:${C.ink};padding:22px 26px`, `<div style="display:flex;justify-content:space-between;font:500 24px JM;letter-spacing:.14em;color:${C.lime}"><span class="lt3">EN ROUTE…</span><span class="pc">0 %</span></div><div style="margin-top:14px;height:16px;border-radius:8px;background:#33333f;overflow:hidden"><div class="fill" style="height:100%;width:0;background:${C.lime}"></div></div>`, 'L');
  const f2fill = f2load.querySelector('.fill'), f2pc = f2load.querySelector('.pc'), f2lt = f2load.querySelector('.lt3');
  const iris = E(world, `width:200px;height:200px;border-radius:50%;box-shadow:0 0 0 2400px ${C.ink}`, '', 'L');
  const dot = E(world, `width:60px;height:60px;border-radius:50%;background:${C.red}`, '', 'L');

  const flood3 = E(world, `width:100px;height:100px;border-radius:50%;background:${C.lime}`, '', 'L');
  const F3 = E(world, 'perspective:1800px', '', 'full');
  const f3mien = MW(F3, 'LE MIEN', `font:140px AB;color:${C.ink};letter-spacing:-.03em`);
  const f3c = Tx(F3, 'IL COÛTE', `font:500 36px JM;letter-spacing:.3em;color:${C.ink}`);
  const ext = EXT(F3, '14€', 400, 26, 110, C.ink, '#3E4A12', '#1C2208');
  const extSh = E(F3, `width:700px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent)`, '', 'L');
  const conf = Array.from({ length: 28 }, (_, i) => ({ e: E(F3, `width:${18 + R() * 20}px;height:${8 + R() * 10}px;background:${[C.ink, C.blue, C.cream, C.ink][i % 4]};border-radius:3px`, '', 'L'), a: R() * Math.PI * 2, d: 380 + R() * 420, r: R() * 720 }));
  const shT = E(world, `width:1080px;height:980px;background:${C.cream}`, '', 'L');
  const shB = E(world, `width:1080px;height:980px;background:${C.cream}`, '', 'L');

  // ================= S5 : cartes =================
  const G = E(world, 'perspective:1600px', '', 'full');
  const gT = MW(G, 'IL A TOUT', `font:130px AB;color:${C.ink};letter-spacing:-.03em`);
  const CARDS = [['run', 'RUNNING', 24.4, 290, 720, C.ink, C.lime], ['bag', 'LUXE', 24.84, 790, 720, C.blue, '#fff'], ['hood', 'STREETWEAR', 25.44, 290, 1170, C.lime, C.ink], ['sneak', 'SNEAKERS', 26.04, 790, 1170, C.red, '#fff']];
  const cards = CARDS.map(([ic, l, t0, x, y, bc, fc]) => {
    const c = E(G, 'width:430px;height:420px', '', 'L p3');
    E(c, `position:absolute;inset:0;border-radius:36px;background:${C.ink};backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font:200px AB;color:rgba(237,235,228,.15)`, '?');
    E(c, `position:absolute;inset:0;border-radius:36px;background:${bc};backface-visibility:hidden;transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px`, `${icon(ic, fc, bc === C.lime ? C.cream : C.ink, 230)}<div style="font:46px AB;color:${fc};white-space:nowrap">${l}</div>`);
    return { c, t0, x, y };
  });

  // ================= S6 : fin =================
  const Hh = E(world, '', '', 'full');
  const hNe = MW(Hh, 'NE FAIS PLUS', `font:116px AB;color:${C.cream};letter-spacing:-.03em`);
  const hCes = MW(Hh, 'CES ERREURS', `font:116px AB;color:${C.red};letter-spacing:-.03em`);
  const recap = [['N°3', 'ACHETER SANS VOIR'], ['N°2', 'ATTENDRE DES SEMAINES'], ['N°1', 'PAYER DES CENTAINES D\'€']].map(([n, m]) => DLG(Hh, `ERREUR ${n}`, m, 860, 44));
  const flood4 = E(world, `width:100px;height:100px;border-radius:50%;background:${C.lime}`, '', 'L');
  const J = E(world, 'perspective:1800px', '', 'full');
  const jLe = MW(J, 'LE FOURNISSEUR', `font:84px AB;color:${C.ink};letter-spacing:-.02em`);
  const ext2 = EXT(J, '14€', 400, 26, 110, C.ink, '#3E4A12', '#1C2208');
  const ext2Sh = E(J, `width:700px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent)`, '', 'L');
  const jCats = Tx(J, '', `font:500 30px JM;color:${C.ink};letter-spacing:.12em`);
  const jRule = E(J, `height:3px;background:${C.ink}`, '', 'L');
  const jPill = E(J, `display:flex;align-items:center;gap:22px;background:${C.ink};border-radius:70px;padding:26px 50px 26px 40px;white-space:nowrap;width:max-content`, `<svg viewBox="0 0 40 40" width="48" height="48"><path d="M20 34 V8 M8 19 L20 7 L32 19" stroke="${C.lime}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="font:62px AB;color:${C.lime};letter-spacing:-.01em">LIEN EN BIO</span>`, 'L');
  const jArr = jPill.querySelector('svg');

  const overlays = Overlays(stage, { scenes: SCENES });
  const caps = Captions(stage, GROUPS, { hideAfter: 28.45 });

  // bloc erreur générique : grand chiffre → badge + fenêtre
  function runError(b, t, tn, td, tEnd, numY = 820) {
    on(b.S, win(t, tn - .05, tEnd));
    if (!win(t, tn - .05, tEnd)) return;
    const k = spring(t - tn, 8, .62), mv = ease(seg(t, td - .1, td + .25));
    const nx = lerp(540, 150, mv), ny = lerp(numY, 330, mv), ns = lerp(1, .0, mv);
    on(b.num, mv < 1);
    b.num.style.transform = `translate(${nx}px,${ny}px) rotateX(${10 + Math.sin(t * 1.4) * 5}deg) rotateY(${lerp(-540, -18, k) + Math.sin(t * 1.7) * 10}deg) scale(${lerp(.1, 1, k) * (1 - mv) + .001})`;
    on(b.lab, mv < 1); b.lab.style.transform = P(540, 1220); b.lab.style.opacity = seg(t, tn + .15, tn + .35) * (1 - mv);
    const bk = spring(t - td - .1, 16, .55);
    on(b.badge, t > td); b.badge.style.transform = P(150, 330) + ` scale(${bk}) rotate(${(1 - bk) * -90}deg)`;
    const dk = spring(t - td, 13, .62);
    on(b.dlg, t > td - .02);
    b.dlg.style.transform = P(lerp(1400, 560, dk), 600) + ` rotate(${lerp(12, -2, dk)}deg)`;
  }

  window.seek = function (T) {
    const t = clamp(T, 0, DUR - 1e-4);
    const bgc = stepColor(BG, t); bg.style.background = bgc;
    const [sx, sy] = shakeAt(t, HITS); world.style.transform = `translate(${sx}px,${sy}px)`;
    on(alarm, win(t, 17.5, 21.4) || win(t, 0, 3.5));
    alarm.style.opacity = (t < 3.5 ? .5 : 1) * (.55 + .45 * Math.sin(t * 9)) * (t < 3.5 ? 1 - seg(t, 3.2, 3.5) : seg(t, 17.5, 17.8) * (1 - seg(t, 21.2, 21.4)));

    // ---------- S1 ----------
    on(A, t < 3.6);
    if (t < 3.6) {
      const out = easeIn(seg(t, 3.25, 3.55));
      dl.forEach(d => {
        const k = spring(t - d.t0, 18, .55);
        on(d.e, t > d.t0);
        d.e.style.transform = P(d.x + Math.cos(d.a) * out * 900, d.y + Math.sin(d.a) * out * 900) + ` rotate(${d.r + out * 40}deg) scale(${k * (1 + out)})`;
        d.e.style.opacity = .35 + .65 * (t < 1.4 ? 1 : 1 - seg(t, 1.4, 1.7) * .7);
      });
      const tk = spring(t - .3, 16, .55);
      on(plate, t > .28); plate.style.transform = P(540, 820) + ` scale(${tk * (1 - out)},${tk * (1 - out)})`;
      on(aTitle, t > .3); aTitle.style.transform = `translate(540px,820px) scale(${lerp(1.8, 1, tk) * (1 - out)})`;
      aTitle.jit(t, t < .6 ? 1 : (Math.floor(t * 6) % 5 === 0 ? .8 : .15));
      on(aSub1, t > .9 && out < 1); aSub1.style.transform = P(540, 1060); aSub1.reveal(t, .96, .025);
      on(aSub2, t > 1.5 && out < 1); aSub2.style.transform = P(540, 1170); aSub2.reveal(t, 1.6, .025);
      on(aSub3, t > 2.7 && out < 1); aSub3.style.transform = P(540, 560); aSub3.style.opacity = seg(t, 2.72, 2.9);
