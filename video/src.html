function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));

    if (gi !== capIdx) {

  window.VIDEO = { w: W, h: H, duration: DUR };

}

window.buildAudio = async function (ctx) {
  const sr = ctx.sampleRate, out = ctx.createGain(); out.gain.value = .9; out.connect(ctx.destination);
  const r = rng(7), nb = ctx.createBuffer(1, sr * 2, sr), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = r() * 2 - 1;
  const noise = (t, dur, type, f0, f1, g0, q = 1, pan = 0) => {
    const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(g0, t + dur * .35); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    s.connect(f).connect(g).connect(p).connect(out); s.start(t, r()); s.stop(t + dur + .05);
  };
  const tone = (t, dur, type, f0, f1, g0, att = .005) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(g0, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + .05);
  };
  const whoosh = (t, d = .45, g = .35, pan = 0) => noise(t - d * .6, d, 'bandpass', 300, 3200, g, 1.4, pan);
  const whooshDown = (t, d = .5, g = .3) => noise(t - d * .4, d, 'bandpass', 2800, 260, g, 1.2);
  const impact = (t, g = .9) => { tone(t, .7, 'sine', 120, 38, g); noise(t, .35, 'lowpass', 2400, 200, g * .45); tone(t, .12, 'triangle', 900, 120, g * .25); };
  const pop = (t, f = 700, g = .3) => { tone(t, .12, 'sine', f, f * .45, g); tone(t, .05, 'triangle', f * 2, f, g * .3); };
  const tick = (t, f = 2400, g = .12) => tone(t, .03, 'square', f, f * .9, g, .001);
  const ding = (t, g = .25) => { tone(t, 1.0, 'sine', 1318.5, 1318, g, .003); tone(t + .07, 1.1, 'sine', 1760, 1759, g * .8, .003); };
  const stampS = (t, g = .8) => { tone(t, .25, 'sine', 90, 45, g); noise(t, .18, 'lowpass', 1800, 300, g * .6); };
  const buzz = (t, g = .16) => { tone(t, .28, 'square', 116, 110, g, .01); tone(t, .28, 'square', 123, 118, g * .7, .01); };
  const riser = (t0, t1, g = .25) => { const d = t1 - t0; const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true; const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3; f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(5000, t1); const gg = ctx.createGain(); gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(g, t1 - .02); gg.gain.exponentialRampToValueAtTime(0.0001, t1 + .03); s.connect(f).connect(gg).connect(out); s.start(t0); s.stop(t1 + .1); };
  const shutter = t => { noise(t, .04, 'highpass', 3000, 2500, .5); noise(t + .07, .06, 'highpass', 2500, 2000, .4); };

  pop(.05, 520, .35); whoosh(.72, .35, .22);
  whoosh(1.5, .4, .3, .4);
  for (let x = 2.8; x < 3.76; x += .06) tick(x, 2200 + (x - 2.8) * 900, .07);
  ding(3.76, .3); stampS(3.92, .5);
  whoosh(4.4, .4, .3, .5);
  for (let i = 0; i < 8; i++) pop(4.42 + i * .07, 500 + i * 60, .18);
  impact(5.8, .6);
  whoosh(6.6, .45, .3, -.3);
  [7.48, 8.04, 8.32].forEach((x, i) => tone(x, .16, 'triangle', 520 - i * 90, 300 - i * 60, .2));
  stampS(8.72, .9);
  whooshDown(9.5, .6, .25);
  riser(10.3, 11.28, .22);
  impact(11.28, 1.0);
  whoosh(12.6, .5, .3); impact(12.84, .8);
  pop(13.8, 420, .4); whoosh(14.1, .3, .3); impact(14.22, .5);
  whoosh(14.45, .6, .28); whooshDown(15.5, .4, .22);
  stampS(16.08, 1.0); ding(16.3, .14);
  whoosh(16.9, .4, .3);
  CATS_T.forEach((x, i) => { pop(x, 600 + i * 140, .25); tick(x, 3000, .05); });
  whoosh(20.3, .6, .4); impact(21.12, .8);
  whoosh(21.55, .3, .25); stampS(21.62, .5);
  whoosh(22.5, .5, .25, .3);
  pop(22.88, 880, .28); pop(24.16, 990, .28);
  tick(25.04, 1500, .2); ding(25.1, .16);
  pop(25.72, 660, .22); pop(26.44, 740, .22); [27.0, 27.08, 27.16].forEach((x, i) => pop(x, 900 + i * 120, .14));
  shutter(27.42);

  riser(35.7, 36.34, .2); impact(36.34, .85);

};

// ======================= PREVIEW =======================
function setupPreview() {
  const R = location.search.includes('render');
  const st = document.getElementById('stage'), ui = document.getElementById('ui');
  if (R) { ui.remove(); return; }
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 50) / H); st.style.transform = `scale(${s})`; st.style.left = `${(innerWidth - W * s) / 2}px`; };
  addEventListener('resize', fit); fit();
  const vo = document.getElementById('vo'), pb = document.getElementById('pb'), sc = document.getElementById('sc'), tc = document.getElementById('tc');
  let playing = false, t0 = 0, base = 0;
  pb.onclick = () => { playing = !playing; if (playing) { vo.currentTime = +sc.value; vo.play().catch(() => {}); t0 = performance.now(); base = +sc.value; } else vo.pause(); pb.textContent = playing ? '❚❚ pause' : '▶ lecture'; };
  sc.oninput = () => { base = +sc.value; t0 = performance.now(); vo.currentTime = base; };
  (function loop() { let t = +sc.value; if (playing) { t = vo.duration && !vo.paused ? vo.currentTime : base + (performance.now() - t0) / 1000; if (t >= DUR) t = 0, base = 0, t0 = performance.now(); sc.value = t; } window.seek(t); tc.textContent = t.toFixed(2); requestAnimationFrame(loop); })();
}
